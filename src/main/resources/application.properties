spring.application.name=cherrybrook-weather

# Render provides the port to bind to via the PORT environment variable.
server.port=${PORT:8080}

# Location shown on the dashboard. Override with environment variables on Render
# (WEATHER_LOCATION_NAME, WEATHER_LOCATION_LATITUDE, WEATHER_LOCATION_LONGITUDE)
# to point the app at a different "Cherry Brook".
weather.location.name=Cherrybrook, NSW, Australia
weather.location.latitude=-33.7217
weather.location.longitude=151.0458

# Climate-normal baseline (WMO standard reference period).
weather.baseline.start-year=1991
weather.baseline.end-year=2020

# How long a fetched report is cached before Open-Meteo is queried again.
weather.cache.ttl-minutes=360
