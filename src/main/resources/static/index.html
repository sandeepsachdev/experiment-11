<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#000000">
    <title>Spring Boot Pacman</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="game-container">
        <h1>PAC-MAN</h1>
        <div class="hud">
            <span>Score: <span id="score">0</span></span>
            <span>Lives: <span id="lives">3</span></span>
        </div>
        <div class="canvas-wrap">
            <canvas id="game" width="448" height="496"></canvas>
        </div>
        <div id="message"></div>
        <div class="dpad" id="dpad" aria-label="Direction pad">
            <button class="dpad-btn up" data-dir="up" aria-label="Up">&#9650;</button>
            <button class="dpad-btn left" data-dir="left" aria-label="Left">&#9664;</button>
            <button class="dpad-btn restart" data-dir="restart" aria-label="Restart">R</button>
            <button class="dpad-btn right" data-dir="right" aria-label="Right">&#9654;</button>
            <button class="dpad-btn down" data-dir="down" aria-label="Down">&#9660;</button>
        </div>
        <p class="controls">Arrow keys, swipe, or tap the D-pad &middot; R to restart</p>
    </div>
    <script src="/js/pacman.js"></script>
</body>
</html>
